# CS234 Project - MiniWoB++ Offline RL

env:
  tasks:
    simple:
      - click-button
      - click-link
      - click-option
      - click-dialog
      - click-dialog-2
    medium:
      - login-user
      - enter-text
      - search-engine
      - navigate-tree
      - click-checkboxes
    hard:
      - email-inbox
      - social-media
      - use-autocomplete
  headless: true
  wait_ms: 500

data:
  save_dir: data          # converted MiniWoB++ human demonstrations
  data_sizes: [10, 25, 50]

state:
  max_dom_elements: 64
  element_feature_dim: 24
  state_dim: 256

training:
  seed: 42
  seeds: [42, 123, 456]
  batch_size: 64
  lr: 3.0e-4
  epochs: 100
  device: auto

bc:
  hidden_dim: 256

iql:
  hidden_dim: 256
  discount: 0.99
  tau: 0.7
  beta: 3.0
  target_update_rate: 0.005

dt:
  n_layers: 4
  n_heads: 4
  embed_dim: 128
  context_length: 20
  dropout: 0.1

ppo:
  hidden_dim: 256
  gamma: 0.99
  eps_clip: 0.2
  update_freq: 5
  batch_size: 128
  max_ep_len: 20
  num_batches: 30
  entropy_coeff: 0.02
  step_penalty: 0.01

eval:
  num_episodes: 50

logging:
  log_interval: 10
  save_dir: results
